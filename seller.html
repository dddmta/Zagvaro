<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Template.mn Seller</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="wrap nav"><a class="logo" href="index.html">Template<span>.mn</span></a><nav><a href="index.html">Store</a><a href="admin.html">Admin</a></nav></div></header>
<main class="section wrap"><span class="eyebrow">SELLER</span><h1>Seller dashboard</h1><p class="muted">Энэ нь seller workflow-ийн demo. Production дээр authentication + database + file storage нэмнэ.</p>
<div class="formCard"><label>Template нэр<input id="name" placeholder="Жишээ: Cafe Instagram Pack"></label><label>Үнэ<input id="price" type="number" placeholder="29900"></label><label>Category<select id="cat"><option>Ресторан</option><option>Beauty & Salon</option><option>Үл хөдлөх</option><option>Online Shop</option><option>Freelancer</option></select></label><label>File<input id="file" type="file"></label><button class="btn" onclick="addProduct()">Demo product нэмэх</button></div><div id="msg" class="notice hidden"></div></main>
<script>
function addProduct(){const n=document.querySelector('#name').value.trim(),p=Number(document.querySelector('#price').value),c=document.querySelector('#cat').value,f=document.querySelector('#file').files[0];if(!n||!p){alert('Нэр болон үнэ оруулна уу.');return}let a=JSON.parse(localStorage.getItem('tm_seller_products')||'[]');a.push({id:'seller-'+Date.now(),name:n,price:p,category:c,file:f?f.name:'demo-file.zip'});localStorage.setItem('tm_seller_products',JSON.stringify(a));document.querySelector('#msg').textContent='Demo product амжилттай нэмэгдлээ. Production дээр server storage руу upload хийнэ.';document.querySelector('#msg').classList.remove('hidden')}
</script></body></html>
